<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f213d"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e05e"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
  </defs>

  <!-- Fundo com cantos arredondados (padrão de ícones iOS/Android) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)"/>

  <!-- Moldura circular dourada -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGradient)" stroke-width="8" opacity="0.85"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Três Estrelas Marianas Superiores -->
  <polygon points="256,75 261,90 276,90 264,100 268,115 256,105 244,115 248,100 236,90 251,90" fill="url(#goldGradient)"/>
  <polygon points="200,95 204,107 217,107 206,115 210,127 200,119 190,127 194,115 183,107 196,107" fill="url(#goldGradient)" opacity="0.75"/>
  <polygon points="312,95 316,107 329,107 318,115 322,127 312,119 302,127 306,115 295,107 308,107" fill="url(#goldGradient)" opacity="0.75"/>

  <!-- Cruz Central Superior -->
  <path d="M250,135 h12 v40 h30 v12 h-30 v85 h-12 v-85 h-30 v-12 h30 z" fill="url(#goldGradient)"/>

  <!-- Monograma Mariano Estilizado (M e A entrelaçados) -->
  <!-- Letra M em arco dourado -->
  <path d="M140,360 L185,210 L256,290 L327,210 L372,360" fill="none" stroke="url(#goldGradient)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Letra A central em branco lírio -->
  <path d="M215,360 L256,230 L297,360" fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="228" y1="318" x2="284" y2="318" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>

  <!-- Base com identificação sutil -->
  <text x="256" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="6">LITURGIA</text>
  <text x="256" y="445" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="3">PARÓQUIA N. SRA. AUXILIADORA</text>
</svg>
